<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LangSwitcher</title>
<meta name="description" content="A free, native macOS menu-bar app that switches your keyboard layout when you tap Cmd+Shift, like Punto Switcher on Windows. Apple Silicon and Intel, no Rosetta.">
<meta name="color-scheme" content="light dark">
<link rel="canonical" href="https://mrjolla.github.io/lang-switcher/">
<link rel="alternate" hreflang="ru" href="https://mrjolla.github.io/lang-switcher/ru/">
<link rel="alternate" hreflang="en" href="https://mrjolla.github.io/lang-switcher/en/">
<link rel="alternate" hreflang="de" href="https://mrjolla.github.io/lang-switcher/de/">
<link rel="alternate" hreflang="es" href="https://mrjolla.github.io/lang-switcher/es/">
<link rel="alternate" hreflang="it" href="https://mrjolla.github.io/lang-switcher/it/">
<link rel="alternate" hreflang="fr" href="https://mrjolla.github.io/lang-switcher/fr/">
<link rel="alternate" hreflang="pt" href="https://mrjolla.github.io/lang-switcher/pt/">
<link rel="alternate" hreflang="x-default" href="https://mrjolla.github.io/lang-switcher/">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/style.css">
<script>
(function () {
  var langs = ["ru","en","de","es","it","fr","pt"], pick = "en";
  try {
    var s = localStorage.getItem("lang");
    if (s && langs.indexOf(s) > -1) pick = s;
    else {
      var n = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"];
      for (var i = 0; i < n.length; i++) {
        var c = String(n[i]).toLowerCase().split("-")[0];
        if (langs.indexOf(c) > -1) { pick = c; break; }
      }
    }
  } catch (err) {
    var n2 = navigator.languages || [navigator.language || "en"];
    for (var j = 0; j < n2.length; j++) {
      var c2 = String(n2[j]).toLowerCase().split("-")[0];
      if (langs.indexOf(c2) > -1) { pick = c2; break; }
    }
  }
  location.replace(pick + "/" + location.search + location.hash);
})();
</script>
</head>
<body class="plain">
<main class="hero container">
<img class="app-icon" src="assets/icon-256.png" width="128" height="128" alt="LangSwitcher">
<h1>LangSwitcher</h1>
<noscript><ul class="lang-list">
<li><a href="ru/" hreflang="ru">Русский</a></li>
<li><a href="en/" hreflang="en">English</a></li>
<li><a href="de/" hreflang="de">Deutsch</a></li>
<li><a href="es/" hreflang="es">Español</a></li>
<li><a href="it/" hreflang="it">Italiano</a></li>
<li><a href="fr/" hreflang="fr">Français</a></li>
<li><a href="pt/" hreflang="pt">Português</a></li>
</ul></noscript>
</main>
</body>
</html>
